[package]
name = "tinline-task-manager"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

# Standalone tooling workspace: do not drag app/media builds into the scheduler.
# crates/peer: the daemon-to-daemon iroh link (LAN only). experiments/ stay independent.
[workspace]
members = ["crates/peer", "crates/platform", "crates/setup"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
sha2 = "0.10"
toml = "0.8"
libc = "0.2"
eframe = { version = "0.33", optional = true, default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
# Daemon-to-daemon link (iroh, LAN only); runs in the daemon's own peer thread/runtime.
task-manager-peer = { path = "crates/peer" }
# Native identity/headroom primitives, independently checkable without an Apple SDK.
task-manager-platform = { path = "crates/platform" }
task-manager-setup = { path = "crates/setup" }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time", "net", "io-util"] }
# Submission policy file (~/.config/tasks/policy.huml); only dependency: serde.
huml-rs = "0.3.0"

# `ui`: the egui window (`tasks ui`); `mcp`: the MCP stdio server (`tasks mcp`). A compute
# worker builds `--no-default-features`: daemon, CLI, peer link and status, no GUI stack.
[features]
default = ["ui", "mcp"]
ui = ["dep:eframe", "task-manager-setup/ui"]
mcp = []

[[bin]]
name = "tasks"
path = "src/bin/tasks/main.rs"
