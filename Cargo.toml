[package]
name = "tinline-task-manager"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

# Standalone tooling workspace: do not drag app/media builds into the scheduler.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
sha2 = "0.10"
toml = "0.8"
libc = "0.2"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

[[bin]]
name = "tasks"
path = "src/bin/tasks/main.rs"
