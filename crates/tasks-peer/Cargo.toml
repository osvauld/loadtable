[package]
name = "tasks-peer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The real iroh transport. Off by default so the core stays light and sync.
iroh = ["dep:iroh", "dep:tokio", "dep:iroh-blobs", "dep:bao-tree"]

[dependencies]
tasks-core.workspace = true
tasks-platform.workspace = true
tasks-runner.workspace = true
tasks-timing.workspace = true
tasks-identity.workspace = true
tasks-ledger.workspace = true
base64 = "0.22"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
# Pure-Rust git (D3). Pinned; only the features sync needs: index files, the ignore-aware
# directory walk and object/ref writing. No network client, no C build, no libgit2.
gix = { version = "=0.90.0", default-features = false, features = ["sha1", "index", "dirwalk", "excludes", "attributes"] }
iroh = { version = "1.3", optional = true }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "sync", "time", "net", "io-util", "macros"] }
# Fetched outputs travel as verified BLAKE3 streams (R-795): the worker's store references the
# files in place, the origin streams them straight into its temporary file.
iroh-blobs = { version = "0.103", optional = true, default-features = false, features = ["fs-store"] }
bao-tree = { version = "0.16", optional = true, default-features = false }

[dev-dependencies]
tempfile.workspace = true
