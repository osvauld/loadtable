# loadtable machine policy. Every line shows the default; uncomment to change.
# Environment variables of the daemon win over this file.
# A bad value refuses the whole file and the daemon runs on the defaults.

[slots]
# compile = 2   # env LOADTABLE_COMPILE_SLOTS
# run = 4   # env LOADTABLE_RUN_SLOTS
# offload = 4   # env LOADTABLE_OFFLOAD_SLOTS
# transfer = 1   # env LOADTABLE_TRANSFER_SLOTS
# light = 4   # env LOADTABLE_LIGHT_SLOTS
# short_lane = 1   # env LOADTABLE_SHORT_LANE_SLOTS
# short_job_max_secs = 60   # env LOADTABLE_SHORT_JOB_MAX_SECS
# short_job_max_memory_mib = 1024   # env LOADTABLE_SHORT_JOB_MAX_MEMORY_MIB

[queue]
# aging_mins = 20   # env LOADTABLE_QUEUE_AGING_MINS

[cpu]
# compile_weight = 50   # env LOADTABLE_CPU_COMPILE_WEIGHT
# run_weight = 200   # env LOADTABLE_CPU_RUN_WEIGHT
# compile_nice = 10   # env LOADTABLE_CPU_COMPILE_NICE

[pressure.compile]
# max_cpu = 40   # env LOADTABLE_COMPILE_MAX_CPU
# max_io = 40   # env LOADTABLE_COMPILE_MAX_IO
# max_memory = "normal"   # env LOADTABLE_COMPILE_MAX_MEMORY

[pressure.run]
# max_cpu = 80   # env LOADTABLE_RUN_MAX_CPU
# max_io = 80   # env LOADTABLE_RUN_MAX_IO
# max_memory = "normal"   # env LOADTABLE_RUN_MAX_MEMORY

[pressure.offload]
# max_memory = "normal"   # env LOADTABLE_OFFLOAD_MAX_MEMORY

[pressure.transfer]
# max_io = 40   # env LOADTABLE_TRANSFER_MAX_IO

[attribution]
# trip_io_pct = 10   # env LOADTABLE_TRIP_IO_PCT
# trip_cpu_pct = 60   # env LOADTABLE_TRIP_CPU_PCT
# trip_interval_secs = 60   # env LOADTABLE_TRIP_INTERVAL_SECS
# sample_secs = 5   # env LOADTABLE_ATTRIB_SAMPLE_SECS

[memory]
# min_available_gib = 2   # env LOADTABLE_MIN_AVAILABLE_GIB
# some_warn = 10   # env LOADTABLE_MEMORY_SOME_WARN
# some_critical = 40   # env LOADTABLE_MEMORY_SOME_CRITICAL
# full_warn = 5   # env LOADTABLE_MEMORY_FULL_WARN
# full_critical = 20   # env LOADTABLE_MEMORY_FULL_CRITICAL

[disk]
# cache_reserve_gib = 20   # env LOADTABLE_CACHE_RESERVE_GIB
# state_reserve_gib = 1   # env LOADTABLE_STATE_RESERVE_GIB

[cache]
# sccache = "auto"   # env LOADTABLE_SCCACHE
# sccache_size_gib = 30   # env LOADTABLE_SCCACHE_SIZE_GIB

[runner]
# cancel_grace_ms = 300   # env LOADTABLE_CANCEL_GRACE_MS
# wall_timeout_secs = "off"   # env LOADTABLE_WALL_TIMEOUT_SECS
# idle_timeout_secs = "off"   # env LOADTABLE_IDLE_TIMEOUT_SECS

[logs]
# soft_cap_mib = 64   # env LOADTABLE_LOG_SOFT_CAP_MIB
# hard_cap_mib = 1024   # env LOADTABLE_LOG_HARD_CAP_MIB

[retention]
# max_finished_jobs = 20000   # env LOADTABLE_RETAIN_JOBS
# max_job_age_days = 60   # env LOADTABLE_RETAIN_JOB_DAYS
# max_sample_age_days = 365   # env LOADTABLE_RETAIN_SAMPLE_DAYS
