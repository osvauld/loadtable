[package]
name = "tasks-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "loadtabled"
path = "src/bin/loadtabled.rs"

[dependencies]
tasks-core.workspace = true
tasks-platform.workspace = true
tasks-ledger.workspace = true
tasks-timing.workspace = true
tasks-admission.workspace = true
tasks-runner.workspace = true
tasks-placement.workspace = true
tasks-policy.workspace = true
tasks-peer.workspace = true
tasks-identity.workspace = true
serde.workspace = true
sha2.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
rustix.workspace = true
signal-hook.workspace = true
iroh = { version = "1.3", optional = true }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "time"] }

[features]
# The real iroh transport for peer forwarding. On by default: a daemon without it cannot reach
# or be reached by any peer, and a pairing ticket from it carries no address. The adapter keeps
# its async runtime on threads of its own. `--no-default-features` builds a local-only daemon.
default = ["iroh"]
iroh = ["tasks-peer/iroh", "dep:iroh", "dep:tokio"]

[dev-dependencies]
tasks-platform = { workspace = true, features = ["fake"] }
