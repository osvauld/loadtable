[package]
name = "task-manager-peer"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
description = "Daemon-to-daemon iroh link of the task manager: LAN-only endpoint, allowlist admission, status/jobs/source/artifact ALPNs"

[dependencies]
# LAN-only: built from presets::Minimal with relays, address lookup and portmapper off.
iroh = "1.3"
# 0.103.x is the line that depends on iroh ^1.0. Only the file-backed store is used.
iroh-blobs = { version = "=0.103.1", default-features = false, features = ["fs-store"] }
# rt-multi-thread: the iroh-blobs fs store uses block_in_place.
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time", "net", "io-util", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
blake3 = "1"
n0-future = "0.3"
bytes = "1"
rand = "0.8"
libc = "0.2"
nix = { version = "0.30", default-features = false }
toml = "0.8"

[dev-dependencies]
tempfile = "3"
