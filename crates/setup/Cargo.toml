[package]
name = "task-manager-setup"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
description = "Inert setup plans and explicit local Apple toolchain preflight; not a build worker"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"
eframe = { version = "0.33", optional = true, default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

[features]
default = []
ui = ["dep:eframe"]

[[bin]]
name = "tasks-mac-setup"
path = "src/bin/tasks-mac-setup.rs"
