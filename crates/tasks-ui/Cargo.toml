[package]
name = "tasks-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The egui window. Off by default: the default workspace build never pulls egui in (R-199).
ui = ["dep:eframe", "dep:png"]

[dependencies]
tasks-core.workspace = true
tasks-daemon.workspace = true
serde_json.workspace = true
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"], optional = true }
png = { version = "0.17", optional = true }
