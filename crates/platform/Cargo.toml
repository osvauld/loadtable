[package]
name = "task-manager-platform"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

# Independent of scheduler, SQLite, networking and GUI. Native admission headroom
# and observational telemetry are distinct APIs, not interchangeable policies.
[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
# No disk/network/user collection or default parallel process refresh.
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
nix = { version = "0.30", default-features = false, features = ["signal", "process"] }

[dev-dependencies]
serde_json = "1"
