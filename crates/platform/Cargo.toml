[package]
name = "task-manager-platform"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

# Kept independent of the scheduler, SQLite, networking and GUI so the native
# primitives can be type-checked for Apple targets without an Apple C SDK.
[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
