name: CI

on:
  push:
    branches: [main, dev, v2]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The same gate the lead runs before a merge: fmt, clippy with warnings as errors, every test.
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-linux
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked --features tasks-cli/mcp -- -D warnings
      - run: cargo test --workspace --locked --features tasks-cli/mcp --no-fail-fast

  # macOS is a release target (the launchd service, the sampler without cgroups), so it has to build
  # and pass clippy natively, not only as a cross-check.
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-macos
      - run: cargo clippy --workspace --all-targets --locked --features tasks-cli/mcp -- -D warnings
      - run: cargo clippy --workspace --all-targets --locked --no-default-features -- -D warnings
      # the confinement profile, run for real under sandbox-exec (R-821, R-831)
      - run: cargo test -p tasks-platform --locked --test confine_macos
