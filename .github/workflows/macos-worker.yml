# UNEXECUTED TEMPLATE. Port completion and owner review are prerequisites.
# No push/PR triggers, releases, deployment, signing credentials, or SDK installers.
name: macOS worker artifacts (unverified template)

on:
  workflow_dispatch:
    inputs:
      acknowledge_unverified_template:
        description: 'Owner reviewed this revision, port readiness, runner architecture, and Xcode consent'
        type: boolean
        required: true
        default: false
      build_worker:
        description: 'Full worker port is complete and natively reviewed (currently BLOCKED; leave false)'
        type: boolean
        default: false
      ios_smoke:
        description: 'Also build the unsigned synthetic iOS simulator fixture (no simulator launch)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: macos-worker-manual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  setup:
    if: ${{ inputs.acknowledge_unverified_template }}
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build and test standalone onboarding (NOT a worker)
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          rustup target list --installed | grep -Fx aarch64-apple-darwin
          cargo test --locked -j 2 -p task-manager-setup --features ui --lib
          cargo test --locked -j 2 -p task-manager-platform --lib
          cargo build --locked --release -j 2 -p task-manager-setup --features ui --bin tasks-mac-setup
          target_dir="$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')"
          bundle="$RUNNER_TEMP/macos-setup/Task Manager Setup.app/Contents"
          mkdir -p "$bundle/MacOS"
          cp "$target_dir/release/tasks-mac-setup" "$bundle/MacOS/tasks-mac-setup"
          python3 -c 'import plistlib,sys; plistlib.dump(dict(CFBundleExecutable="tasks-mac-setup",CFBundleIdentifier="org.example.taskmanager.setup",CFBundleName="Task Manager Setup",CFBundlePackageType="APPL",CFBundleShortVersionString="0.1.0",CFBundleVersion="1",LSMinimumSystemVersion="13.0",NSHighResolutionCapable=True),open(sys.argv[1],"wb"))' "$bundle/Info.plist"
          cp docs/MACOS-FIRST-RUN.md "$RUNNER_TEMP/macos-setup/"
          { echo 'SETUP ONLY: no worker, pairing or remote execution; unsigned; not notarized'; git rev-parse HEAD; sw_vers; uname -sm; rustc -Vv; cargo -V; } > "$RUNNER_TEMP/macos-setup/BUILD-INFO.txt"
          "$bundle/MacOS/tasks-mac-setup" --json > "$RUNNER_TEMP/macos-setup/UNPROBED-PLAN.json"
          otool -L "$bundle/MacOS/tasks-mac-setup" > "$RUNNER_TEMP/macos-setup/LINKED-LIBRARIES.txt"
          cd "$RUNNER_TEMP"
          /usr/bin/ditto -c -k --keepParent macos-setup tasks-mac-setup-aarch64.zip
          shasum -a 256 tasks-mac-setup-aarch64.zip > tasks-mac-setup-SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tasks-mac-setup-aarch64-${{ github.sha }}
          path: |
            ${{ runner.temp }}/tasks-mac-setup-aarch64.zip
            ${{ runner.temp }}/tasks-mac-setup-SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  worker:
    if: ${{ inputs.acknowledge_unverified_template && inputs.build_worker }}
    # Owner must verify this label supplies Apple Silicon for their repository.
    # Architecture assertion below fails closed; never silently cross-build on Intel.
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check preinstalled tools and record provenance
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          xcode-select -p
          xcodebuild -version
          rustup target list --installed | grep -Fx aarch64-apple-darwin
          mkdir -p "$RUNNER_TEMP/macos-worker/bundle"
          {
            echo 'UNVERIFIED TEMPLATE OUTPUT: unsigned; not notarized; not an installer'
            git rev-parse HEAD
            git status --porcelain
            sw_vers
            uname -sm
            xcode-select -p
            xcodebuild -version
            xcrun --sdk macosx --show-sdk-version
            rustc -Vv
            cargo -V
            echo 'target=aarch64-apple-darwin; release; jobs=2'
          } > "$RUNNER_TEMP/macos-worker/bundle/BUILD-INFO.txt"
      - name: Compile headless and UI variants (port must already be integrated)
        run: |
          set -euo pipefail
          target_dir="$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')"
          cargo build --locked --release --target aarch64-apple-darwin -j 2 --no-default-features --bin tasks
          cp "$target_dir/aarch64-apple-darwin/release/tasks" "$RUNNER_TEMP/macos-worker/bundle/tasks-headless"
          cargo build --locked --release --target aarch64-apple-darwin -j 2 --bin tasks
          cp "$target_dir/aarch64-apple-darwin/release/tasks" "$RUNNER_TEMP/macos-worker/bundle/tasks-ui"
          file "$RUNNER_TEMP/macos-worker/bundle/"tasks-*
          otool -L "$RUNNER_TEMP/macos-worker/bundle/tasks-headless" "$RUNNER_TEMP/macos-worker/bundle/tasks-ui" > "$RUNNER_TEMP/macos-worker/bundle/LINKED-LIBRARIES.txt"
          cp docs/MACOS-FIRST-RUN.md "$RUNNER_TEMP/macos-worker/bundle/"
      - name: Archive preserving modes and symlinks
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/macos-worker"
          mv bundle tasks-macos-aarch64
          /usr/bin/ditto -c -k --keepParent tasks-macos-aarch64 tasks-macos-aarch64.zip
          shasum -a 256 tasks-macos-aarch64.zip > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tasks-macos-aarch64-${{ github.sha }}
          path: |
            ${{ runner.temp }}/macos-worker/tasks-macos-aarch64.zip
            ${{ runner.temp }}/macos-worker/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  ios-smoke:
    if: ${{ inputs.acknowledge_unverified_template && inputs.ios_smoke }}
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Compile synthetic simulator app (no install or launch)
        run: bash tests/fixtures/ios-smoke/build-simulator.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-smoke-simulator-${{ github.sha }}
          path: |
            tests/fixtures/ios-smoke/out/IOSSmoke.app.zip
            tests/fixtures/ios-smoke/out/SHA256SUMS
            tests/fixtures/ios-smoke/out/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 7
