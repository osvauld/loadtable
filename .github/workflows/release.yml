name: Release builds

# A merge to main whose workspace version has no vX.Y.Z tag yet builds the binaries for every
# published target, tags that commit and drafts the GitHub release with them; when the tag exists
# the run stops after the version check. Pushing a vX.Y.Z tag by hand does the same for that tag.
# Publishing the draft (by hand, after testing) triggers publish-r2.yml.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      # true when this run builds and drafts a release
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Validate release version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # on main, a version already tagged is already released (or being released): stop here
          tagged=false
          if [ "$GITHUB_REF_TYPE" = branch ]; then
            version=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")
            if gh api "repos/$GH_REPO/git/ref/tags/v$version" >/dev/null 2>&1; then
              tagged=true
              echo "v$version is already tagged; nothing to release."
            fi
          fi
          TAGGED=$tagged python3 - <<'PY'
          import os, re, tomllib
          with open('Cargo.toml', 'rb') as f:
              version = tomllib.load(f)['workspace']['package']['version']
          ref_type, ref_name = os.environ['GITHUB_REF_TYPE'], os.environ['GITHUB_REF_NAME']
          pushed_main = os.environ['GITHUB_EVENT_NAME'] == 'push' and ref_type == 'branch' and ref_name == 'main'
          release = ref_type == 'tag' or (pushed_main and os.environ['TAGGED'] != 'true')
          if release:
              if not re.fullmatch(r'\d+\.\d+\.\d+', version):
                  raise SystemExit('Only stable X.Y.Z versions are released')
              if ref_type == 'tag' and ref_name != f'v{version}':
                  raise SystemExit(f'Tag {ref_name} does not match the workspace version {version}')
              notes = f'docs/releases/v{version}.md'
              if not (os.path.isfile(notes) and os.path.getsize(notes)):
                  raise SystemExit(f'No release notes for v{version}: add {notes} and merge it to main')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'version={version}\n')
              f.write(f'release={str(release).lower()}\n')
          PY

  build:
    needs: version
    # a manual run on a branch builds without tagging or drafting, to try the build
    if: needs.version.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds run on the oldest supported Ubuntu, so the binaries need no newer glibc than 2.35.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            smoke: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            smoke: true
          - target: aarch64-apple-darwin
            os: macos-14
            smoke: true
          # Intel Macs: cross-built on the Apple silicon runner, so it cannot be run there.
          - target: x86_64-apple-darwin
            os: macos-14
            smoke: false
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TARGET: ${{ matrix.target }}
      # The build stamp's commit when git is not available (crates/tasks-daemon/build.rs).
      LOADTABLE_BUILD_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target "$TARGET"
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
      # The CLI carries the MCP server (agents start it as `loadtable mcp`) and the desktop window
      # (`loadtable ui`). The window loads its graphics libraries only when it opens, so the same
      # binary runs on a headless worker; there `loadtable ui` says there is no display (R-832).
      - name: Build loadtable and loadtabled
        run: cargo build --release --locked --target "$TARGET" -p tasks-daemon -p tasks-cli --features tasks-cli/mcp,tasks-cli/ui
      - name: Package
        shell: bash
        run: |
          name="loadtable-$VERSION-$TARGET"
          mkdir -p "dist/$name/bin"
          cp "target/$TARGET/release/loadtable" "target/$TARGET/release/loadtabled" "dist/$name/bin/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
      - name: Smoke test
        if: matrix.smoke
        shell: bash
        run: |
          bin="dist/loadtable-$VERSION-$TARGET/bin"
          "$bin/loadtable" --version
          "$bin/loadtabled" --version
          # the stamp names the tagged commit
          "$bin/loadtabled" --version | grep -q "($(git rev-parse --short HEAD) "
          "$bin/loadtable" --help >/dev/null
          "$bin/loadtabled" --help >/dev/null
          # the window is built in: its help is not the "built without ui" stub (R-199)
          "$bin/loadtable" --help | grep -q "The desktop window (built in)"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  draft-release:
    if: needs.version.outputs.release == 'true'
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docs/releases
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create the draft release and attach the binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          (cd artifacts && sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS)
          # a merge to main tags the commit it built; a pushed tag is already there
          if [ "$GITHUB_REF_TYPE" = branch ]; then
            gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null
            echo "Tagged $GITHUB_SHA as $TAG"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true || {
              echo 'Refusing to replace the binaries of a published release'; exit 1;
            }
          else
            # the notes were checked in the version job
            gh release create "$TAG" --verify-tag --draft --title "LoadTable $TAG" \
              --notes-file "docs/releases/$TAG.md"
          fi
          gh release upload "$TAG" artifacts/* --clobber
