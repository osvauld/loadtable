[package]
name = "task-manager-osvauld-foundation"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
autobins = false

# Isolated API characterization, not a production dependency/deployment change.
[workspace]

[lib]
path = "src/lib.rs"

# Experimental two-process LAN peer (gate 4). SYNTHETIC test account only.
[[bin]]
name = "lan-peer"
path = "src/bin/lan_peer.rs"

[dependencies]
identity = { path = "/home/abe/osvauld2/identity" }
storage = { path = "/home/abe/osvauld2/storage" }
vault = { path = "/home/abe/osvauld2/vault" }
courier = { path = "/home/abe/osvauld2/courier" }
# Same iroh major as the parent's voice POC; configured without presets::N0, relays or
# address lookup (see src/lib.rs).
iroh = "1.3"
tokio = { version = "1", features = ["macros", "rt", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.8"

[dev-dependencies]
loro = "1.13.9"
tempfile = "3"
